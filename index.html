<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Learning Platform</title>
  <style>
    :root {
      --bg: #f7f8fc;
      --text: #1f2937;
      --muted: #4b5563;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --text: #f9fafb;
        --muted: #d1d5db;
        --accent: #818cf8;
        --accent-hover: #6366f1;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }

    main {
      max-width: 600px;
    }

    .greeting {
      display: inline-block;
      margin-bottom: 20px;
      padding: 6px 16px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      color: var(--accent);
      font-weight: 600;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.2;
    }

    p {
      margin: 0 0 32px;
      font-size: 1.125rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .button {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }

    .button:hover,
    .button:focus-visible {
      background: var(--accent-hover);
    }

    .button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <div class="greeting"><span aria-hidden="true">👋</span> We're so glad you're here</div>
    <h1>Welcome to My Learning Platform</h1>
    <p>Whether you're just starting out or picking up where you left off, this is a friendly space to learn at your own pace. Clear lessons, hands-on practice, and no pressure, just steady progress, one lesson at a time.</p>
    <a class="button" href="#">Start Learning</a>
  </main>
</body>
</html>
