<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password · My Learning Platform</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <main class="page">
    <div class="card" style="max-width:420px;margin:24px auto">
      <h1 style="font-size:1.4rem;margin-top:0">Choose a new password</h1>
      <div id="message" class="hidden"></div>
      <form id="reset-form">
        <div class="field">
          <label for="password">New password</label>
          <input id="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="button block" type="submit">Update password</button>
      </form>
    </div>
  </main>
  <script>
    App.renderNav();
    App.$("#reset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = App.$("#message");
      const password = App.$("#password").value;
      if (password.length < 8) return App.showAlert(msg, "Password must be at least 8 characters.");
      if (!(await App.getSession())) return App.showAlert(msg, "This reset link has expired. Please request a new one from the log in page.");
      const { error } = await App.sb.auth.updateUser({ password });
      if (error) return App.showAlert(msg, App.errorText(error));
      App.showAlert(msg, "Password updated. Taking you to your dashboard…", "success");
      setTimeout(() => location.replace("dashboard.html"), 1200);
    });
  </script>
</body>
</html>
