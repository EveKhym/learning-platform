<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Certificate · My Learning Platform</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <main class="page">
    <div class="card" style="max-width:460px;margin:24px auto">
      <h1 style="font-size:1.4rem;margin-top:0">Verify a certificate</h1>
      <p class="muted">Enter the certificate ID printed at the bottom of the certificate.</p>
      <form action="certificate.html" method="get">
        <div class="field"><label for="code">Certificate ID</label><input id="code" name="code" required placeholder="e.g. 3FA2C91B0D"></div>
        <button class="button block" type="submit">Verify</button>
      </form>
    </div>
  </main>
  <script>App.renderNav();</script>
</body>
</html>
