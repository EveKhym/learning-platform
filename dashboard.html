<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · My Learning Platform</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <main class="page" id="root"><div class="spinner">Loading your dashboard…</div></main>

  <script>
    App.renderNav();
    const { esc } = App;

    (async () => {
      const me = await App.requireAuth();
      const root = App.$("#root");

      const [statsRes, enrollRes, progressRes, certRes] = await Promise.all([
        App.sb.rpc("get_learning_stats"),
        App.sb.from("enrollments").select("*, courses(*, lessons(id, title, position))").order("last_activity_at", { ascending: false }),
        App.sb.from("lesson_progress").select("course_id, lesson_id"),
        App.sb.from("certificates").select("code, issued_at, courses(title, emoji)").order("issued_at", { ascending: false }),
      ]);
      const stats = statsRes.data || {};
      const enrollments = (enrollRes.data || []).filter((e) => e.courses);
      const doneByCourse = {};
      for (const p of progressRes.data || []) (doneByCourse[p.course_id] ??= new Set()).add(p.lesson_id);

      const firstName = (me.profile.full_name || "there").split(" ")[0];
      const resume = enrollments.find((e) => !e.completed_at);
      let resumeLesson;
      if (resume) {
        const lessons = resume.courses.lessons.sort((a, b) => a.position - b.position);
        const done = doneByCourse[resume.course_id] || new Set();
        resumeLesson = lessons.find((l) => l.id === resume.last_lesson_id && !done.has(l.id)) || lessons.find((l) => !done.has(l.id));
      }

      // 17-week activity heatmap, oldest first, columns are weeks.
      const activity = stats.activity || {};
      const today = new Date();
      const start = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate() - 7 * 17 + 1));
      start.setUTCDate(start.getUTCDate() - start.getUTCDay());
      const cells = [];
      for (let d = new Date(start); d <= today; d.setUTCDate(d.getUTCDate() + 1)) {
        const key = d.toISOString().slice(0, 10), n = activity[key] || 0;
        cells.push(`<span data-level="${n === 0 ? 0 : n < 2 ? 1 : n < 4 ? 2 : 3}" title="${key}: ${n} lesson${n === 1 ? "" : "s"}"></span>`);
      }

      const sub = me.subscription;
      const planNote = me.premium
        ? `<span class="badge premium">★ ${esc(sub.plans.name)}${sub.status === "trialing" ? " trial" : ""}</span>`
        : `<a class="badge accent" href="pricing.html">Free plan · Upgrade</a>`;

      root.innerHTML = `
        <div class="page-header row spread">
          <div><h1>Welcome back, ${esc(firstName)} 👋</h1><p>${stats.current_streak ? `You're on a ${stats.current_streak}-day streak. Keep it going!` : "Complete a lesson today to start a streak."}</p></div>
          ${planNote}
        </div>

        <section class="stats">
          <div class="card stat"><div class="value">🔥 ${stats.current_streak ?? 0}</div><div class="label">Day streak (best ${stats.longest_streak ?? 0})</div></div>
          <div class="card stat"><div class="value">${stats.lessons_completed ?? 0}</div><div class="label">Lessons completed</div></div>
          <div class="card stat"><div class="value">${stats.minutes_learned ?? 0}</div><div class="label">Minutes learned</div></div>
          <div class="card stat"><div class="value">${stats.courses_completed ?? 0}/${stats.courses_enrolled ?? 0}</div><div class="label">Courses completed</div></div>
        </section>

        ${resumeLesson ? `<section class="card row spread" style="margin-bottom:28px">
          <div><span class="subtle">Continue where you left off</span><h2 style="margin:4px 0 0;font-size:1.2rem">${esc(resume.courses.emoji)} ${esc(resume.courses.title)}: ${esc(resumeLesson.title)}</h2></div>
          <a class="button" href="lesson.html?id=${resumeLesson.id}">Resume →</a>
        </section>` : ""}

        <section class="card" style="margin-bottom:28px">
          <h2 style="font-size:1.1rem">Your activity</h2>
          <div class="heatmap" aria-label="Lessons completed per day over the last 17 weeks">${cells.join("")}</div>
        </section>

        <h2>My courses</h2>
        ${enrollments.length
          ? `<div class="grid">${enrollments.map((e) => App.courseCard(e.courses, { total: e.courses.lessons.length, done: doneByCourse[e.course_id]?.size || 0 })).join("")}</div>`
          : `<div class="card empty"><p>You haven't started a course yet.</p><a class="button" href="courses.html">Browse courses</a></div>`}

        <h2 style="margin-top:36px">Certificates</h2>
        ${certRes.data?.length
          ? `<div class="grid">${certRes.data.map((c) => `<a class="card" style="text-decoration:none;color:inherit" href="certificate.html?code=${esc(c.code)}">
              <div style="font-size:1.8rem">🎓</div><h3 style="margin:8px 0 4px">${esc(c.courses.title)}</h3><span class="subtle">Issued ${App.formatDate(c.issued_at)}</span></a>`).join("")}</div>`
          : `<p class="muted">Finish every lesson in a course to earn a certificate.</p>`}`;
    })();
  </script>
</body>
</html>
