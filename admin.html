<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · My Learning Platform</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .admin-layout { display: grid; gap: 24px; grid-template-columns: 280px minmax(0, 1fr); align-items: start; }
    @media (max-width: 860px) { .admin-layout { grid-template-columns: minmax(0, 1fr); } }
    .pick { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 10px; font: inherit; color: var(--text); cursor: pointer; }
    .pick:hover, .pick[aria-current="true"] { background: var(--surface-2); }
    .two { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 600px) { .two { grid-template-columns: 1fr; } }
    textarea.code { font-family: ui-monospace, Consolas, monospace; font-size: 0.9rem; min-height: 220px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <main class="page" id="root"><div class="spinner">Loading…</div></main>

  <script>
    App.renderNav();
    const { esc, sb } = App;
    const state = { courses: [], course: null, lesson: null };

    // Quiz text format:  "Q: question" then one option per line, "-" wrong, "*" correct.
    const quizToText = (qs) => qs.map((q) => `Q: ${q.question}\n` +
      q.options.map((o, i) => `${i === q.correct_index ? "*" : "-"} ${o}`).join("\n")).join("\n\n");
    function textToQuiz(text) {
      const out = [];
      for (const raw of text.split("\n")) {
        const line = raw.trim();
        if (!line) continue;
        if (/^Q:/i.test(line)) out.push({ question: line.slice(2).trim(), options: [], correct_index: -1 });
        else if (/^[-*]/.test(line) && out.length) {
          const q = out[out.length - 1];
          if (line[0] === "*") q.correct_index = q.options.length;
          q.options.push(line.slice(1).trim());
        } else throw new Error(`Couldn't read this quiz line: "${line}"`);
      }
      for (const q of out) {
        if (q.options.length < 2) throw new Error(`"${q.question}" needs at least two options.`);
        if (q.correct_index < 0) throw new Error(`Mark the correct answer for "${q.question}" with *.`);
      }
      return out;
    }

    async function loadCourses() {
      const { data } = await sb.from("courses").select("*, lessons(id, position, title, duration_minutes, is_preview)").order("created_at");
      state.courses = data || [];
      for (const c of state.courses) c.lessons.sort((a, b) => a.position - b.position);
      if (state.course) state.course = state.courses.find((c) => c.id === state.course.id) || null;
    }

    function render() {
      const c = state.course;
      App.$("#course-list").innerHTML = state.courses.map((x) =>
        `<button class="pick" data-course="${x.id}" aria-current="${x.id === c?.id}">${esc(x.emoji)} ${esc(x.title)}
          <br><span class="subtle">${x.published ? "Published" : "Draft"} · ${x.is_premium ? "Premium" : "Free"} · ${x.lessons.length} lessons</span></button>`).join("");

      const panel = App.$("#panel");
      if (!c && !state.creating) return (panel.innerHTML = `<div class="card empty">Pick a course to edit, or create a new one.</div>`);
      const v = c || { title: "", slug: "", summary: "", description: "", category: "General", level: "Beginner", emoji: "📘", color: "#4f46e5", is_premium: false, published: false };

      panel.innerHTML = `
        <section class="card">
          <h2>${c ? "Edit course" : "New course"}</h2>
          <form id="course-form">
            <div class="two">
              <div class="field"><label>Title</label><input name="title" required value="${esc(v.title)}"></div>
              <div class="field"><label>URL slug</label><input name="slug" required pattern="[a-z0-9-]+" value="${esc(v.slug)}" placeholder="my-course"></div>
            </div>
            <div class="field"><label>Short summary</label><input name="summary" value="${esc(v.summary)}"></div>
            <div class="field"><label>Description</label><textarea name="description">${esc(v.description)}</textarea></div>
            <div class="two">
              <div class="field"><label>Category</label><input name="category" value="${esc(v.category)}"></div>
              <div class="field"><label>Level</label><select name="level">${["Beginner", "Intermediate", "Advanced"].map((l) => `<option${l === v.level ? " selected" : ""}>${l}</option>`).join("")}</select></div>
              <div class="field"><label>Emoji</label><input name="emoji" value="${esc(v.emoji)}"></div>
              <div class="field"><label>Colour</label><input name="color" type="color" value="${esc(v.color)}"></div>
            </div>
            <div class="row" style="margin-bottom:16px">
              <label class="checkbox"><input type="checkbox" name="is_premium"${v.is_premium ? " checked" : ""}> Premium (Pro only)</label>
              <label class="checkbox"><input type="checkbox" name="published"${v.published ? " checked" : ""}> Published</label>
            </div>
            <div class="row">
              <button class="button" type="submit">Save course</button>
              ${c ? `<a class="button secondary" href="course.html?slug=${encodeURIComponent(c.slug)}">View</a>
                     <button class="button danger" type="button" id="delete-course">Delete</button>` : ""}
            </div>
          </form>
        </section>
        ${c ? `<section class="card" style="margin-top:24px">
          <div class="row spread"><h2 style="margin:0">Lessons</h2><button class="button small" id="new-lesson">+ Add lesson</button></div>
          <ol class="lesson-list" style="margin-top:12px">${c.lessons.map((l) => `<li><a href="#" data-lesson="${l.id}">
            <span class="lesson-check">${l.position}</span><span>${esc(l.title)}${l.is_preview ? ' <span class="badge accent">Preview</span>' : ""}</span>
            <span class="meta">${l.duration_minutes} min</span></a></li>`).join("") || '<li class="subtle" style="padding:12px 0">No lessons yet.</li>'}</ol>
        </section>
        <div id="lesson-panel"></div>` : ""}`;
    }

    async function openLesson(lessonId) {
      const c = state.course;
      let lesson = { title: "", position: (c.lessons.at(-1)?.position || 0) + 1, duration_minutes: 5, is_preview: false };
      let content = { body: "", video_url: "" }, quiz = [];
      if (lessonId) {
        lesson = c.lessons.find((l) => l.id === lessonId);
        const [ct, qz] = await Promise.all([
          sb.from("lesson_content").select("*").eq("lesson_id", lessonId).maybeSingle(),
          sb.rpc("admin_get_quiz", { p_lesson_id: lessonId }),
        ]);
        content = ct.data || content;
        quiz = qz.data || [];
      }
      App.$("#lesson-panel").innerHTML = `<section class="card" style="margin-top:24px">
        <h2>${lessonId ? "Edit lesson" : "New lesson"}</h2>
        <div id="lesson-msg" class="hidden"></div>
        <form id="lesson-form">
          <div class="field"><label>Title</label><input name="title" required value="${esc(lesson.title)}"></div>
          <div class="two">
            <div class="field"><label>Position</label><input name="position" type="number" min="1" required value="${lesson.position}"></div>
            <div class="field"><label>Duration (minutes)</label><input name="duration_minutes" type="number" min="1" value="${lesson.duration_minutes}"></div>
          </div>
          <label class="checkbox" style="margin-bottom:16px"><input type="checkbox" name="is_preview"${lesson.is_preview ? " checked" : ""}> Free preview (open to everyone on Premium courses)</label>
          <div class="field"><label>Video URL (YouTube, Vimeo, or .mp4, optional)</label><input name="video_url" value="${esc(content.video_url)}"></div>
          <div class="field"><label>Lesson content (Markdown)</label><textarea class="code" name="body">${esc(content.body)}</textarea></div>
          <div class="field"><label>Quiz (optional)</label>
            <textarea class="code" name="quiz" style="min-height:140px" placeholder="Q: What is 2 + 2?&#10;- 3&#10;* 4&#10;- 5">${esc(quizToText(quiz))}</textarea>
            <p class="subtle" style="margin:6px 0 0">Start each question with <code>Q:</code>. Put each option on its own line starting with <code>-</code>, and mark the correct one with <code>*</code>.</p></div>
          <div class="row">
            <button class="button" type="submit">Save lesson</button>
            ${lessonId ? `<a class="button secondary" href="lesson.html?id=${lessonId}">View</a><button class="button danger" type="button" id="delete-lesson">Delete</button>` : ""}
          </div>
        </form></section>`;
      App.$("#lesson-panel").scrollIntoView({ behavior: "smooth" });

      App.$("#lesson-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target), msg = App.$("#lesson-msg");
        let questions;
        try { questions = textToQuiz(f.get("quiz")); } catch (err) { return App.showAlert(msg, err.message); }
        const row = { course_id: c.id, title: f.get("title"), position: +f.get("position"),
          duration_minutes: +f.get("duration_minutes") || 5, is_preview: f.has("is_preview") };
        const res = lessonId ? await sb.from("lessons").update(row).eq("id", lessonId).select().single()
          : await sb.from("lessons").insert(row).select().single();
        if (res.error) return App.showAlert(msg, res.error.code === "23505" ? "Another lesson already uses that position." : App.errorText(res.error));
        const id = res.data.id;
        const [ct, qz] = await Promise.all([
          sb.from("lesson_content").upsert({ lesson_id: id, body: f.get("body"), video_url: f.get("video_url").trim() || null }),
          sb.rpc("admin_save_quiz", { p_lesson_id: id, p_questions: questions }),
        ]);
        if (ct.error || qz.error) return App.showAlert(msg, App.errorText(ct.error || qz.error));
        App.toast("Lesson saved");
        await loadCourses(); render(); openLesson(id);
      });

      App.$("#delete-lesson")?.addEventListener("click", async () => {
        if (!confirm("Delete this lesson? Learner progress for it will be removed.")) return;
        const { error } = await sb.from("lessons").delete().eq("id", lessonId);
        if (error) return App.toast(App.errorText(error));
        await loadCourses(); render();
      });
    }

    (async () => {
      const me = await App.requireAuth();
      const root = App.$("#root");
      if (!me.profile.is_admin) return (root.innerHTML = `<div class="empty"><h1>Admins only</h1><p>Your account doesn't have admin access.</p></div>`);

      const [{ data: overview }] = await Promise.all([sb.rpc("admin_overview"), loadCourses()]);
      const o = overview || {};
      root.innerHTML = `
        <div class="page-header"><h1>Admin</h1><p>Manage courses, lessons and quizzes.</p></div>
        <section class="stats">
          <div class="card stat"><div class="value">${o.learners ?? 0}</div><div class="label">Learners</div></div>
          <div class="card stat"><div class="value">${o.premium ?? 0}</div><div class="label">Pro members (incl. trials)</div></div>
          <div class="card stat"><div class="value">${o.enrollments ?? 0}</div><div class="label">Enrollments</div></div>
          <div class="card stat"><div class="value">${o.completions ?? 0}</div><div class="label">Certificates issued</div></div>
          <div class="card stat"><div class="value">${o.lessons_completed_7d ?? 0}</div><div class="label">Lessons done (7 days)</div></div>
        </section>
        <div class="admin-layout">
          <aside class="card"><button class="button block" id="new-course" style="margin-bottom:12px">+ New course</button><div id="course-list"></div></aside>
          <div id="panel"></div>
        </div>`;
      render();

      root.addEventListener("click", (e) => {
        const pick = e.target.closest("[data-course]");
        const lessonLink = e.target.closest("[data-lesson]");
        if (pick) { state.creating = false; state.course = state.courses.find((c) => c.id === pick.dataset.course); render(); }
        else if (e.target.id === "new-course") { state.creating = true; state.course = null; render(); }
        else if (e.target.id === "new-lesson") openLesson(null);
        else if (lessonLink) { e.preventDefault(); openLesson(lessonLink.dataset.lesson); }
        else if (e.target.id === "delete-course") deleteCourse();
      });

      root.addEventListener("submit", async (e) => {
        if (e.target.id !== "course-form") return;
        e.preventDefault();
        const f = new FormData(e.target);
        const row = Object.fromEntries(["title", "slug", "summary", "description", "category", "level", "emoji", "color"].map((k) => [k, f.get(k).trim()]));
        row.is_premium = f.has("is_premium");
        row.published = f.has("published");
        const res = state.course ? await sb.from("courses").update(row).eq("id", state.course.id).select().single()
          : await sb.from("courses").insert(row).select().single();
        if (res.error) return App.toast(res.error.code === "23505" ? "That URL slug is already taken." : App.errorText(res.error));
        App.toast("Course saved");
        state.creating = false;
        state.course = res.data;
        await loadCourses(); render();
      });

      async function deleteCourse() {
        if (!confirm(`Delete "${state.course.title}" and all its lessons? This can't be undone.`)) return;
        const { error } = await sb.from("courses").delete().eq("id", state.course.id);
        if (error) return App.toast(App.errorText(error));
        state.course = null;
        await loadCourses(); render();
      }
    })();
  </script>
</body>
</html>
